<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Soccer Drills</title>
<meta name="description" content="Pick shooting, passing, or defending, open a mystery box, and get a fun, easy soccer drill.">
<meta name="theme-color" content="#f4f7f5">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:title" content="My Soccer Drills">
<meta property="og:description" content="Open a mystery box. Get a soccer drill. Go play!">
<meta property="og:image" content="https://my-soccer-drills.vercel.app/thumbnail.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="gift" viewBox="0 0 100 100">
    <ellipse class="g-shadow" cx="50" cy="93" rx="36" ry="5"/>
    <rect class="g-body" x="16" y="44" width="68" height="46" rx="7"/>
      <path class="g-body-shade" d="M64 44H77a7 7 0 0 1 7 7V83a7 7 0 0 1-7 7H64Z"/>
      <rect class="g-body-shade" x="16" y="44" width="68" height="5"/>
      <rect class="g-ribbon" x="44" y="44" width="12" height="46"/>
    <rect class="g-lid-edge" x="10" y="34" width="80" height="16" rx="6"/>
      <rect class="g-lid" x="10" y="30" width="80" height="16" rx="6"/>
      <rect class="g-ribbon" x="44" y="30" width="12" height="20"/>
      <rect class="g-shine" x="16" y="33.5" width="20" height="3.5" rx="1.75"/>
      <path class="g-ribbon" d="M50 31 C40 10 20 14 28 28 C32 33 43 32 50 31Z"/>
      <path class="g-ribbon" d="M50 31 C60 10 80 14 72 28 C68 33 57 32 50 31Z"/>
      <path class="g-ribbon-d" d="M50 31 C43 19 33 20 34 26 C36 30 44 31 50 31Z"/>
      <path class="g-ribbon-d" d="M50 31 C57 19 67 20 66 26 C64 30 56 31 50 31Z"/>
      <rect class="g-ribbon-d" x="45" y="25" width="10" height="9" rx="3.5"/>
  </symbol>
  <symbol id="gift-open" viewBox="0 0 100 100">
    <ellipse class="g-shadow" cx="50" cy="93" rx="36" ry="5"/>
    <rect class="g-inside" x="16" y="40" width="68" height="10" rx="4"/>
    <circle class="g-ball" cx="50" cy="36" r="16"/>
      <polygon class="g-patch" points="50,29.5 56.5,34 54,41.5 46,41.5 43.5,34"/>
      <path class="g-patch" d="M38 27 L42 30 L40 35 L35.5 33 Z M62 27 L58 30 L60 35 L64.5 33 Z M50 20.5 L54 22 L50 24.5 L46 22Z"/>
    <rect class="g-body" x="16" y="44" width="68" height="46" rx="7"/>
      <path class="g-body-shade" d="M64 44H77a7 7 0 0 1 7 7V83a7 7 0 0 1-7 7H64Z"/>
      <rect class="g-body-shade" x="16" y="44" width="68" height="5"/>
      <rect class="g-ribbon" x="44" y="44" width="12" height="46"/>
    <g transform="translate(-6 10) rotate(-34 22 40) scale(.62)"><rect class="g-lid-edge" x="10" y="34" width="80" height="16" rx="6"/>
      <rect class="g-lid" x="10" y="30" width="80" height="16" rx="6"/>
      <rect class="g-ribbon" x="44" y="30" width="12" height="20"/>
      <rect class="g-shine" x="16" y="33.5" width="20" height="3.5" rx="1.75"/>
      <path class="g-ribbon" d="M50 31 C40 10 20 14 28 28 C32 33 43 32 50 31Z"/>
      <path class="g-ribbon" d="M50 31 C60 10 80 14 72 28 C68 33 57 32 50 31Z"/>
      <path class="g-ribbon-d" d="M50 31 C43 19 33 20 34 26 C36 30 44 31 50 31Z"/>
      <path class="g-ribbon-d" d="M50 31 C57 19 67 20 66 26 C64 30 56 31 50 31Z"/>
      <rect class="g-ribbon-d" x="45" y="25" width="10" height="9" rx="3.5"/></g>
    <path class="g-ribbon" d="M86 18 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
    <path class="g-ribbon" d="M78 4 l1.4 3.4 3.4 1.4 -3.4 1.4 -1.4 3.4 -1.4 -3.4 -3.4 -1.4 3.4 -1.4z"/>
  </symbol>
</svg>

<main id="app">
  <!-- HOME -->
  <section id="home" class="screen active">
    <header class="hero">
      <img src="icon.svg" alt="" class="hero-icon">
      <h1>My Soccer<br><span>Drills</span></h1>
      <p class="tag">Pick a category. Open a mystery box. Go play!<br><small>Most drills work indoors — just use a soft ball.</small></p>
    </header>
    <div class="cats">
      <button class="cat shooting" data-cat="shooting">
        <span class="cat-emoji">🥅</span>
        <span class="cat-name">Shooting</span>
        <span class="cat-count" data-count="shooting">0 / 30 opened</span>
      </button>
      <button class="cat passing" data-cat="passing">
        <span class="cat-emoji">🎯</span>
        <span class="cat-name">Passing</span>
        <span class="cat-count" data-count="passing">0 / 30 opened</span>
      </button>
      <button class="cat defending" data-cat="defending">
        <span class="cat-emoji">🛡️</span>
        <span class="cat-name">Defending</span>
        <span class="cat-count" data-count="defending">0 / 30 opened</span>
      </button>
    </div>
  </section>

  <!-- BOXES -->
  <section id="boxes" class="screen">
    <div class="topbar">
      <button class="back" id="backHome" aria-label="Back">←</button>
      <h2 id="catTitle">Shooting</h2>
      <button class="reset" id="resetCat" title="Close all boxes">↺</button>
    </div>
    <p class="hint">Tap a box to see what drill is inside!</p>
    <div class="grid" id="grid"></div>
  </section>
</main>

<!-- REVEAL -->
<div id="reveal" class="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="drillName">
    <div class="card-top">
      <span class="badge" id="drillBadge">Box #1</span>
      <span class="cat-chip" id="drillCat">Shooting</span>
    </div>
    <h3 id="drillName">Drill</h3>
    <div class="meta"><span id="drillPlace" class="place">🏠 Indoors</span><span id="drillTimes" class="times">Not done yet</span></div>
    <ol id="drillSteps" class="steps"></ol>
    <div class="actions">
      <button class="again" id="againBtn">🔁 Do it again</button>
      <button class="done" id="doneBtn">I did it! ⚽</button>
    </div>
  </div>
</div>

<!-- Opening animation -->
<div id="opening" class="overlay opening" hidden>
  <div class="stage">
    <div class="rays"></div>
    <div class="glow"></div>
    <svg class="big-gift" viewBox="0 0 100 100" aria-hidden="true">
      <ellipse class="g-shadow" cx="50" cy="93" rx="36" ry="5"/>
      <rect class="g-inside" x="16" y="40" width="68" height="10" rx="4"/>
      <g class="big-ball"><circle class="g-ball" cx="50" cy="36" r="16"/>
      <polygon class="g-patch" points="50,29.5 56.5,34 54,41.5 46,41.5 43.5,34"/>
      <path class="g-patch" d="M38 27 L42 30 L40 35 L35.5 33 Z M62 27 L58 30 L60 35 L64.5 33 Z M50 20.5 L54 22 L50 24.5 L46 22Z"/></g>
      <g class="big-body"><rect class="g-body" x="16" y="44" width="68" height="46" rx="7"/>
      <path class="g-body-shade" d="M64 44H77a7 7 0 0 1 7 7V83a7 7 0 0 1-7 7H64Z"/>
      <rect class="g-body-shade" x="16" y="44" width="68" height="5"/>
      <rect class="g-ribbon" x="44" y="44" width="12" height="46"/>
        <circle cx="50" cy="68" r="11" fill="#fff"/>
        <text id="openNum" x="50" y="73.5" text-anchor="middle" class="g-num">1</text>
      </g>
      <g class="big-lid"><rect class="g-lid-edge" x="10" y="34" width="80" height="16" rx="6"/>
      <rect class="g-lid" x="10" y="30" width="80" height="16" rx="6"/>
      <rect class="g-ribbon" x="44" y="30" width="12" height="20"/>
      <rect class="g-shine" x="16" y="33.5" width="20" height="3.5" rx="1.75"/>
      <path class="g-ribbon" d="M50 31 C40 10 20 14 28 28 C32 33 43 32 50 31Z"/>
      <path class="g-ribbon" d="M50 31 C60 10 80 14 72 28 C68 33 57 32 50 31Z"/>
      <path class="g-ribbon-d" d="M50 31 C43 19 33 20 34 26 C36 30 44 31 50 31Z"/>
      <path class="g-ribbon-d" d="M50 31 C57 19 67 20 66 26 C64 30 56 31 50 31Z"/>
      <rect class="g-ribbon-d" x="45" y="25" width="10" height="9" rx="3.5"/></g>
    </svg>
    <div class="flash"></div>
    <div class="parts" id="parts"></div>
  </div>
  <p class="open-label" id="openLabel">Opening box…</p>
</div>

<div id="confetti" aria-hidden="true"></div>

<script src="drills.js"></script>
<script src="app.js"></script>
</body>
</html>
