<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Soccer Drills</title>
<meta name="description" content="Pick shooting, passing, or defending, open a mystery box, and get a fun, easy soccer drill.">
<meta name="theme-color" content="#f4f7f5">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:title" content="My Soccer Drills">
<meta property="og:description" content="Open a mystery box. Get a soccer drill. Go play!">
<meta property="og:image" content="https://my-soccer-drills.vercel.app/thumbnail.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app">
  <!-- HOME -->
  <section id="home" class="screen active">
    <header class="hero">
      <img src="icon.svg" alt="" class="hero-icon">
      <h1>My Soccer<br><span>Drills</span></h1>
      <p class="tag">Pick a category. Open a mystery box. Go play!<br><small>Most drills work indoors — just use a soft ball.</small></p>
    </header>
    <div class="cats">
      <button class="cat shooting" data-cat="shooting">
        <span class="cat-emoji">🥅</span>
        <span class="cat-name">Shooting</span>
        <span class="cat-count" data-count="shooting">0 / 30 opened</span>
      </button>
      <button class="cat passing" data-cat="passing">
        <span class="cat-emoji">🎯</span>
        <span class="cat-name">Passing</span>
        <span class="cat-count" data-count="passing">0 / 30 opened</span>
      </button>
      <button class="cat defending" data-cat="defending">
        <span class="cat-emoji">🛡️</span>
        <span class="cat-name">Defending</span>
        <span class="cat-count" data-count="defending">0 / 30 opened</span>
      </button>
    </div>
  </section>

  <!-- BOXES -->
  <section id="boxes" class="screen">
    <div class="topbar">
      <button class="back" id="backHome" aria-label="Back">←</button>
      <h2 id="catTitle">Shooting</h2>
      <button class="reset" id="resetCat" title="Close all boxes">↺</button>
    </div>
    <p class="hint">Tap a box to see what drill is inside!</p>
    <div class="grid" id="grid"></div>
  </section>
</main>

<!-- REVEAL -->
<div id="reveal" class="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="drillName">
    <div class="card-top">
      <span class="badge" id="drillBadge">Box #1</span>
      <span class="cat-chip" id="drillCat">Shooting</span>
    </div>
    <h3 id="drillName">Drill</h3>
    <div class="meta"><span id="drillPlace" class="place">🏠 Indoors</span><span id="drillTimes" class="times">Not done yet</span></div>
    <ol id="drillSteps" class="steps"></ol>
    <div class="actions">
      <button class="again" id="againBtn">🔁 Do it again</button>
      <button class="done" id="doneBtn">I did it! ⚽</button>
    </div>
  </div>
</div>

<!-- Opening animation -->
<div id="opening" class="overlay opening" hidden>
  <div class="big-box"><div class="lid"></div><div class="body"><span id="openNum">1</span></div></div>
</div>

<div id="confetti" aria-hidden="true"></div>

<script src="drills.js"></script>
<script src="app.js"></script>
</body>
</html>
